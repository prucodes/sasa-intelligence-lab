# Build the static site and deploy it to GitHub Pages.
#
# The app is a vinext (Next App Router) project that targets a server by default; this
# builds the fully static variant (scripts/build-static.mjs) and publishes dist-static/.
# The Pages base path is derived from the repo name, so this works under
# username.github.io/<repo>/ whatever the repo is called — no hard-coded path.
#
# One-time setup in the repo: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Then every push to main redeploys.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue the newest without cancelling in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Base path = "/<repo>", matching the Pages project-subpath URL.
      - run: node scripts/build-static.mjs --base "/${{ github.event.repository.name }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
